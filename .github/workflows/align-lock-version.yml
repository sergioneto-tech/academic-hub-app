name: Align package lock version

on:
  push:
    branches:
      - feature/calendar-course-view

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/calendar-course-view
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align npm metadata without changing dependencies
        run: npm version 1.6.5 --no-git-tag-version --allow-same-version
      - name: Verify lock metadata
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.6.5'||l.version!=='1.6.5'||l.packages[''].version!=='1.6.5') process.exit(1)"
      - name: Commit aligned lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Alinhar metadata npm para 1.6.5"
          git push origin HEAD:feature/calendar-course-view
