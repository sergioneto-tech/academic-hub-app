name: Apply Academic Hub notice queue 1.5.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-notice-queue-1-5-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply notice priority and release 1.5.2
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const layoutPath = 'src/components/Layout.tsx';
          let layout = fs.readFileSync(layoutPath, 'utf8');

          if (!layout.includes('CLOUD_SYNC_NOTICE_VISIBILITY_EVENT')) {
            layout = layout.replace(
              'import ReleaseUpdateNotice, { type ReleaseUpdateEntry } from "@/components/ReleaseUpdateNotice";',
              'import ReleaseUpdateNotice, { type ReleaseUpdateEntry } from "@/components/ReleaseUpdateNotice";\nimport { CLOUD_SYNC_NOTICE_VISIBILITY_EVENT } from "@/components/CloudSyncNotice";'
            );
          }

          if (!layout.includes('[cloudNoticeVisible,setCloudNoticeVisible]')) {
            layout = layout.replace(
              /\[migrationNoticePending,setMigrationNoticePending\]=useState\(\(\)=>isMigrationNoticePending\(\)\);/,
              '[migrationNoticePending,setMigrationNoticePending]=useState(()=>isMigrationNoticePending()),[cloudNoticeVisible,setCloudNoticeVisible]=useState(false),[expandWhatsNew,setExpandWhatsNew]=useState(false);'
            );
          }

          if (!layout.includes('setCloudNoticeVisible(Boolean(custom.detail?.visible))')) {
            layout = layout.replace(
              'useEffect(()=>{const d=()=>setMigrationNoticePending(false);',
              'useEffect(()=>{const h=(event:Event)=>{const custom=event as CustomEvent<{visible?:boolean}>;setCloudNoticeVisible(Boolean(custom.detail?.visible))};window.addEventListener(CLOUD_SYNC_NOTICE_VISIBILITY_EVENT,h);return()=>window.removeEventListener(CLOUD_SYNC_NOTICE_VISIBILITY_EVENT,h)},[]);useEffect(()=>{const d=()=>setMigrationNoticePending(false);'
            );
          }

          layout = layout.replace(
            'const dismissWhatsNew=()=>{setShowWhatsNew(false);setLastSeenRelease(APP_VERSION);',
            'const dismissWhatsNew=()=>{setShowWhatsNew(false);setExpandWhatsNew(false);setLastSeenRelease(APP_VERSION);'
          );

          layout = layout.replace(
            '{showWhatsNew&&whatsNew&&<div className="fixed inset-0 z-[90] grid place-items-center bg-slate-950/60 p-4">',
            '{showWhatsNew&&whatsNew&&!cloudNoticeVisible&&!((updateAvailable||releaseNotesUpdateAvailable)&&!deferUpdate&&latestEntry)&&<div className="fixed inset-0 z-[90] grid place-items-center bg-slate-950/60 p-4">'
          );

          const oldList = '<ul className="mt-3 grid gap-1.5 text-xs text-muted-foreground">{whatsNew.changes.slice(0,8).map(c=><li key={c}>• {c}</li>)}</ul>';
          const newList = '<ul className="mt-3 grid gap-1.5 text-xs text-muted-foreground">{whatsNew.changes.slice(0,8).map((c,index)=><li key={c} className={cn(index>=3&&!expandWhatsNew&&"hidden sm:list-item")}>• {c}</li>)}</ul>{whatsNew.changes.length>3&&<Button size="sm" variant="ghost" className="mt-2 px-0 sm:hidden" onClick={()=>setExpandWhatsNew(value=>!value)}>{expandWhatsNew?"Ver menos":"Ver todas as alterações"}</Button>}';
          if (layout.includes(oldList)) layout = layout.replace(oldList, newList);

          layout = layout.replace(
            'available={updateAvailable||releaseNotesUpdateAvailable}',
            'available={!cloudNoticeVisible&&(updateAvailable||releaseNotesUpdateAvailable)}'
          );

          const required = [
            'CLOUD_SYNC_NOTICE_VISIBILITY_EVENT',
            '[cloudNoticeVisible,setCloudNoticeVisible]',
            'setCloudNoticeVisible(Boolean(custom.detail?.visible))',
            'Ver todas as alterações',
            'available={!cloudNoticeVisible&&(updateAvailable||releaseNotesUpdateAvailable)}',
          ];
          for (const marker of required) {
            if (!layout.includes(marker)) throw new Error(`Layout patch incompleto: ${marker}`);
          }
          fs.writeFileSync(layoutPath, layout);

          const versionPath = 'src/lib/version.ts';
          let versionSource = fs.readFileSync(versionPath, 'utf8');
          versionSource = versionSource.replace(/APP_VERSION\s*=\s*["']1\.5\.1["']/, 'APP_VERSION = "1.5.2"');
          if (!versionSource.includes('APP_VERSION = "1.5.2"')) throw new Error('Não foi possível atualizar APP_VERSION para 1.5.2');
          fs.writeFileSync(versionPath, versionSource);

          const notesPath = 'public/release-notes.json';
          const notes = JSON.parse(fs.readFileSync(notesPath, 'utf8'));
          notes.versions = Array.isArray(notes.versions) ? notes.versions : [];
          const entry = {
            version: '1.5.2',
            date: '2026-09-09',
            kind: 'app',
            pushNotify: false,
            changes: [
              'Nova fila de avisos evita sobreposição entre conflitos de dados, sincronização cloud, atualizações e o resumo O que mudou.',
              'Conflitos entre dispositivos têm prioridade e já não podem ser substituídos por um simples aviso de dados atualizados.',
              'Avisos de dados atualizados fecham automaticamente após alguns segundos e libertam o aviso seguinte da fila.',
              'No telemóvel, O que mudou mostra primeiro três alterações e permite expandir apenas quando necessário.',
              'Mantida a atualização real e individual por dispositivo, sem percentagens simuladas.'
            ]
          };
          const existing = notes.versions.findIndex((item) => item?.version === entry.version);
          if (existing >= 0) notes.versions[existing] = entry;
          else notes.versions.unshift(entry);
          notes.latest = entry.version;
          fs.writeFileSync(notesPath, JSON.stringify(notes, null, 2) + '\n');

          const swPath = 'public/sw.js';
          let sw = fs.readFileSync(swPath, 'utf8');
          sw = sw.replace(/const SW_VERSION = "[^"]+";/, 'const SW_VERSION = "1.5.2-update-control-1";');
          sw = sw.replace(/"\.\/release-notes\.json\?v=[^"]+",/, '"./release-notes.json?v=1.5.2",');
          if (!sw.includes('1.5.2-update-control-1')) throw new Error('Não foi possível atualizar SW para 1.5.2');
          fs.writeFileSync(swPath, sw);
          NODE

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/Layout.tsx src/lib/version.ts public/release-notes.json public/sw.js; then
            echo "Already applied."
            exit 0
          fi
          git config user.name "academic-hub-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add src/components/Layout.tsx src/lib/version.ts public/release-notes.json public/sw.js
          git commit -m "release: Academic Hub 1.5.2 notice queue"
          git pull --rebase origin main
          git push origin HEAD:main
