name: Apply final PageSpeed tweaks

on:
  push:
    branches:
      - perf/pagespeed-optimizations
    paths:
      - ".github/workflows/apply-pagespeed-final-tweaks.yml"
      - "scripts/apply_pagespeed_final_tweaks.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/pagespeed-optimizations
          fetch-depth: 0

      - name: Apply final tweaks
        run: python scripts/apply_pagespeed_final_tweaks.py

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Verify tests and build
        run: |
          npm run test
          npm run build

      - name: Commit tweaks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Layout.tsx public/llms.txt public/_headers
          git commit -m "Fix contrast, agent index and deferred release notes"
          git push origin HEAD:perf/pagespeed-optimizations
