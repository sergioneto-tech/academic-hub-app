name: Apply PageSpeed optimizations

on:
  push:
    branches:
      - perf/pagespeed-optimizations
    paths:
      - ".github/workflows/apply-ui-guidance.yml"
      - "scripts/apply_pagespeed_optimizations.py"
      - "package.json"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/pagespeed-optimizations
          fetch-depth: 0

      - name: Apply optimizations
        run: python scripts/apply_pagespeed_optimizations.py

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Verify tests and production build
        run: |
          npm run test
          npm run build

      - name: Commit optimizations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/components/MigrationNotice.tsx src/components/Layout.tsx src/lib/migrationNoticeState.ts src/pages/AcademicReport.tsx src/index.css index.html public/llms.txt public/_headers package.json
          git commit -m "Optimize initial load, CLS, accessibility and discovery"
          git push origin HEAD:perf/pagespeed-optimizations
