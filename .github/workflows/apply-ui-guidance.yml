name: Apply final UI corrections

on:
  push:
    branches:
      - migration/account-pilot
    paths:
      - ".github/workflows/apply-ui-guidance.yml"
      - "scripts/apply_ui_final_fixes.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: migration/account-pilot
          fetch-depth: 0

      - name: Apply final corrections
        run: python scripts/apply_ui_final_fixes.py

      - name: Verify corrections
        run: |
          set -euo pipefail
          grep -q "dashboard-metric-card" src/pages/Dashboard.tsx
          grep -q "Como escolher o modelo" src/components/CourseEvaluationSettings.tsx
          grep -q "Escala inválida" src/components/CourseEvaluationSettings.tsx
          grep -q "flex min-h-36 flex-col items-center" src/pages/FlexibleCourseDetail.tsx

      - name: Commit corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx src/pages/FlexibleCourseDetail.tsx src/components/CourseEvaluationSettings.tsx src/index.css
          git commit -m "Fix card alignment and invalid evaluation scales"
          git push origin HEAD:migration/account-pilot
