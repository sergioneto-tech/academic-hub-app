name: Bump Academic Hub 1.5.4
on:
  push:
    paths:
      - .github/workflows/bump-1-5-4.yml
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update version metadata
        run: |
          set -euo pipefail
          sed -i 's/APP_VERSION = "1.5.3"/APP_VERSION = "1.5.4"/' src/lib/version.ts
          npm version 1.5.4 --no-git-tag-version
          jq '.latest = "1.5.4" | .versions = ([{"version":"1.5.4","date":"2026-09-10","kind":"app","pushNotify":false,"changes":["Reforçado o controlo de atualizações por dispositivo através de um app-shell gerido pelo Service Worker.","A partir desta transição, novas versões publicadas deixam de substituir silenciosamente a versão instalada num arranque a frio.","Release notes, estado de segurança e Service Worker continuam a ser consultados pela rede para detetar atualizações sem desbloquear o novo bundle.","Mantidas as fases reais de atualização e a ativação apenas após o utilizador escolher Atualizar.","Ativada de forma persistente a gravação dos Auth Audit Logs do Supabase no Postgres para reforçar a investigação de eventos de autenticação."]}] + [.versions[] | select(.version != "1.5.4")])' public/release-notes.json > /tmp/release-notes.json
          mv /tmp/release-notes.json public/release-notes.json
          git config user.name academic-hub-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/lib/version.ts package.json package-lock.json public/release-notes.json
          git commit -m 'fix: publish controlled updater transition v1.5.4'
          git push
