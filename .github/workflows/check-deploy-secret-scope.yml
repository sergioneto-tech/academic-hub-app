name: Check deploy secret scope

on:
  push:
    branches:
      - chore/check-deploy-secret-scope
    paths:
      - ".github/workflows/check-deploy-secret-scope.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check repository-level secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          echo "Deploy secrets are available without the production environment."

      - name: Check project reference target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" = "dayettlozmkjagrymjai" ]; then
            echo "Project reference targets the current Academic Hub project."
          else
            echo "Repository project reference does not target the current Academic Hub project."
            exit 2
          fi

      - name: Check Supabase management token
        shell: bash
        run: |
          set -euo pipefail
          list_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://api.supabase.com/v1/projects" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          project_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Management API list-projects status: $list_status"
          echo "Management API target-project status: $project_status"
          test "$list_status" = "200"
          test "$project_status" = "200"
