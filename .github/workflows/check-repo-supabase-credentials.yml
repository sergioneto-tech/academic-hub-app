name: Check repository Supabase credentials

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-repo-supabase-credentials.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: dayettlozmkjagrymjai
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate repository-level credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$status" != "200" ]; then
            echo "::error::Repository SUPABASE_ACCESS_TOKEN is not authorized for the current project (HTTP $status)."
            exit 3
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Repository-level Supabase credentials validated."
