name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/auth-email-templates.json"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations, auth config and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: apgoyzfzuukkpmuxiqvy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="apgoyzfzuukkpmuxiqvy"
          if [ "$SUPABASE_PROJECT_REF" != "$expected_ref" ]; then
            echo "::error::O workflow não aponta para o projeto Supabase de produção do Academic Hub."
            exit 2
          fi

          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$status" != "200" ]; then
            echo "::error::O SUPABASE_ACCESS_TOKEN do environment production não está autorizado para o projeto atual (HTTP $status)."
            exit 3
          fi

          echo "Destino e token Supabase validados para o Academic Hub atual."

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --include-all

      # Não usamos `supabase config push` em CI: o comando consulta recursos de
      # infraestrutura que não fazem parte da configuração do Academic Hub e
      # obrigaria a alargar desnecessariamente o token. Mantemos explicitamente
      # apenas o Auth Hook suportado pela Management API. Os Auth Audit Logs são
      # monitorizados através da API de Logs com um token separado e read-only.
      - name: Apply Academic Hub auth hook
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"hook_before_user_created_enabled":true,"hook_before_user_created_uri":"pg-functions://postgres/public/hook_restrict_signup_to_uab"}' \
            > /dev/null
          echo "Auth Hook do Academic Hub aplicado."

      - name: Apply Academic Hub email templates
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --silent --show-error --fail-with-body \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @supabase/auth-email-templates.json; then
            echo "::warning::Não foi possível personalizar os emails de autenticação automaticamente. O restante deploy pode continuar; verifica Authentication > Email Templates no Supabase."
          fi

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "supabase/functions" ] && find supabase/functions -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "No Edge Functions found; skipping function deployment."
          fi
