name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/auth-email-templates.json"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations, auth config and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: apgoyzfzuukkpmuxiqvy
      SUPABASE_DB_POOLER_HOST: aws-1-eu-west-1.pooler.supabase.com
      SUPABASE_DB_POOLER_USER: postgres.apgoyzfzuukkpmuxiqvy

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="apgoyzfzuukkpmuxiqvy"
          if [ "$SUPABASE_PROJECT_REF" != "$expected_ref" ]; then
            echo "::error::O workflow não aponta para o projeto Supabase de produção do Academic Hub."
            exit 2
          fi

          status=""
          for attempt in 1 2 3; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --connect-timeout 10 --max-time 20 \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN") || status="000"

            if [ "$status" = "200" ]; then
              break
            fi

            # 5xx/000 são falhas transitórias da Management API/rede, não prova
            # de token inválido. Repetimos antes de bloquear o deploy.
            if [[ "$status" =~ ^5 ]] || [ "$status" = "000" ]; then
              echo "::warning::Validação Supabase temporariamente indisponível (HTTP $status, tentativa $attempt/3)."
              sleep $((attempt * 2))
              continue
            fi

            echo "::error::O SUPABASE_ACCESS_TOKEN do environment production não está autorizado para o projeto atual (HTTP $status)."
            exit 3
          done

          if [ "$status" != "200" ]; then
            echo "::error::Não foi possível validar o destino Supabase após 3 tentativas (último HTTP $status)."
            exit 4
          fi

          echo "Destino e token Supabase validados para o Academic Hub atual."

      # O `supabase link` consulta chaves/configuração adicionais do projeto e pode
      # falhar com scoped PATs mesmo quando o token tem apenas as permissões de CI
      # necessárias. Para migrações usamos diretamente o Session Pooler IPv4,
      # recomendado para ambientes como GitHub Actions sem IPv6 garantido.
      - name: Build secure IPv4 database URL
        shell: bash
        run: |
          set -euo pipefail
          db_url=$(python - <<'PY'
          import os
          from urllib.parse import quote

          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          user = os.environ["SUPABASE_DB_POOLER_USER"]
          host = os.environ["SUPABASE_DB_POOLER_HOST"]
          print(f"postgresql://{user}:{password}@{host}:5432/postgres")
          PY
          )
          echo "::add-mask::$db_url"
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      # Não usamos `supabase config push` em CI: o comando consulta recursos de
      # infraestrutura que não fazem parte da configuração do Academic Hub e
      # obrigaria a alargar desnecessariamente o token. Mantemos explicitamente
      # apenas o Auth Hook suportado pela Management API. Os Auth Audit Logs são
      # monitorizados através da API de Logs com um token separado e read-only.
      - name: Verify Academic Hub auth hook function
        shell: bash
        run: |
          set -euo pipefail
          # O PAT de CI é deliberadamente limitado e não tem permissão para alterar
          # config/auth via Management API. A função e os grants são geridos por
          # migrations; a associação do Hook permanece uma configuração protegida
          # do projeto, evitando alargar o token apenas para cada deploy.
          result=$(psql "$SUPABASE_DB_URL" -Atc "
            select case
              when has_function_privilege(
                'supabase_auth_admin',
                'public.hook_restrict_signup_to_uab(jsonb)',
                'EXECUTE'
              ) then 'ok' else 'missing' end;
          ")
          if [ "$result" != "ok" ]; then
            echo "::error::A função do Auth Hook não está executável por supabase_auth_admin."
            exit 1
          fi
          echo "Função e grants do Auth Hook validados."

      - name: Apply Academic Hub email templates
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --silent --show-error --fail-with-body \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @supabase/auth-email-templates.json; then
            echo "::warning::Não foi possível personalizar os emails de autenticação automaticamente. O restante deploy pode continuar; verifica Authentication > Email Templates no Supabase."
          fi

      - name: Verify Edge Functions deployment capability
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "supabase/functions" ] || ! find supabase/functions -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "No Edge Functions found; skipping function deployment."
            exit 0
          fi

          # O PAT de produção é deliberadamente restrito. Deploy de Edge Functions
          # exige uma permissão de Management API mais ampla do que migrations.
          # Não aumentamos privilégios só para tornar o CI verde: se o PAT não
          # puder listar funções, validamos a limitação e deixamos o deploy das
          # funções para o canal administrativo já usado pelo projeto.
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN") || status="000"

          if [ "$status" = "200" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          elif [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::notice::PAT de CI sem privilégio de deploy de Edge Functions; menor privilégio preservado. Migrations e verificações de base concluídas."
          else
            echo "::error::Não foi possível validar a capacidade de deploy de Edge Functions (HTTP $status)."
            exit 1
          fi
