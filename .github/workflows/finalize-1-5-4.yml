name: Finalize 1.5.4 metadata
on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-1-5-4.yml"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update release metadata
        run: |
          python - <<'PY'
          import json
          p='public/release-notes.json'
          with open(p,encoding='utf-8') as f: d=json.load(f)
          r=next(x for x in d['versions'] if x['version']=='1.5.4')
          r['kind']='mixed'
          r['securityLevel']='2026.09'
          r['securitySummary']='Ativa a correlação com logs nativos do Supabase e reforça o controlo real das atualizações por dispositivo.'
          r['pushNotify']=False
          r['changes']=[
            'Reforçado o controlo de atualizações por dispositivo através de um app-shell gerido pelo Service Worker.',
            'A partir desta transição, novas versões publicadas deixam de substituir silenciosamente a versão instalada num arranque a frio.',
            'Ativado o vigilante dos logs nativos do Supabase para detetar padrões repetidos de falhas de autenticação e rate limiting fora do formulário do Academic Hub.',
            'A telemetria do formulário passa a servir apenas para correlação com a conta; a criação de incidentes de tentativas falhadas depende dos sinais nativos de maior confiança.',
            'Incidentes nativos são deduplicados, registados na área privada e podem desencadear alerta ao aluno, alerta administrativo e mini-vistoria estrutural.',
            'Mantidas as fases reais de atualização, sem percentagens simuladas, e sem impacto permanente de processamento no dispositivo.'
          ]
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git config user.name "academic-hub-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add public/release-notes.json
          git commit -m "release: classify 1.5.4 as app and security" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
