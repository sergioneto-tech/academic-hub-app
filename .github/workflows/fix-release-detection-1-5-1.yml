name: Fix release detection 1.5.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-release-detection-1-5-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch release detection and service worker version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const layoutPath = 'src/components/Layout.tsx';
          let layout = fs.readFileSync(layoutPath, 'utf8');
          layout = layout.replace(
            'fetch(notesUrl,{cache:"force-cache"})',
            'fetch(`${notesUrl}?ts=${Date.now()}`,{cache:"no-store"})'
          );
          if (!layout.includes('fetch(`${notesUrl}?ts=${Date.now()}`,{cache:"no-store"})')) {
            throw new Error('Não foi possível tornar release-notes no-store');
          }
          fs.writeFileSync(layoutPath, layout);

          const swPath = 'public/sw.js';
          let sw = fs.readFileSync(swPath, 'utf8');
          sw = sw.replace('const SW_VERSION = "1.5.0-update-control-1";', 'const SW_VERSION = "1.5.1-update-control-1";');
          sw = sw.replace('"./release-notes.json?v=1.5.0",', '"./release-notes.json?v=1.5.1",');
          if (!sw.includes('1.5.1-update-control-1')) throw new Error('Não foi possível atualizar SW_VERSION');
          fs.writeFileSync(swPath, sw);
          NODE

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/Layout.tsx public/sw.js; then
            echo "Release detection already fixed."
            exit 0
          fi
          git config user.name "academic-hub-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add src/components/Layout.tsx public/sw.js
          git commit -m "fix: bypass cache when checking Academic Hub releases"
          git pull --rebase origin main
          git push origin HEAD:main
