name: Correct v1.5.4 Release Note
on:
  push:
    paths:
      - .github/workflows/fix-v1-5-4-release-note.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Correct release note
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/release-notes.json')
          text = p.read_text()
          old = 'Ativada de forma persistente a gravação dos Auth Audit Logs do Supabase no Postgres para reforçar a investigação de eventos de autenticação.'
          new = 'Validado o token dedicado e read-only para consulta dos logs nativos do Supabase; a integração externa permanece condicionada à disponibilidade efetiva desses eventos no projeto.'
          if old not in text:
              raise SystemExit('release note target not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name academic-hub-release-bot
          git config user.email actions@users.noreply.github.com
          git add public/release-notes.json
          git commit -m 'docs: correct v1.5.4 logs capability note'
          git push
