name: Generate app icons

on:
  push:
    branches:
      - main
    paths:
      - "public/academic-hub-icon-current-v8.svg"
      - ".github/workflows/generate-app-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate PNG icons from master SVG
        run: |
          set -euo pipefail
          SRC="public/academic-hub-icon-current-v8.svg"
          rsvg-convert -w 32 -h 32 "$SRC" -o public/academic-hub-icon-v10-32.png
          rsvg-convert -w 180 -h 180 "$SRC" -o public/academic-hub-icon-v10-180.png
          rsvg-convert -w 192 -h 192 "$SRC" -o public/academic-hub-icon-v10-192.png
          rsvg-convert -w 512 -h 512 "$SRC" -o public/academic-hub-icon-v10-512.png
          cp public/academic-hub-icon-v10-512.png public/academic-hub-icon-v10-512-maskable.png

      - name: Commit generated icons
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/academic-hub-icon-v10-32.png \
                  public/academic-hub-icon-v10-180.png \
                  public/academic-hub-icon-v10-192.png \
                  public/academic-hub-icon-v10-512.png \
                  public/academic-hub-icon-v10-512-maskable.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
            exit 0
          fi
          git commit -m "Generate app icons from master Academic Hub logo"
          git push
