name: Generate app icons

on:
  push:
    branches:
      - main
    paths:
      - "public/academic-hub-icon-current-v8.svg"
      - ".github/workflows/generate-app-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Extract embedded artwork and generate PNG icons
        run: |
          set -euo pipefail
          SRC="public/academic-hub-icon-current-v8.svg"
          python - <<'PY'
          import base64, re
          from pathlib import Path

          svg = Path("public/academic-hub-icon-current-v8.svg").read_text(encoding="utf-8")
          match = re.search(r'data:image/jpeg;base64,([^"\']+)', svg, re.S)
          if not match:
              raise SystemExit("Embedded JPEG artwork was not found in the master SVG")
          raw = re.sub(r"\s+", "", match.group(1))
          Path("/tmp/academic-hub-master.jpg").write_bytes(base64.b64decode(raw))
          PY

          identify /tmp/academic-hub-master.jpg
          convert /tmp/academic-hub-master.jpg -strip -resize 32x32! public/academic-hub-icon-v10-32.png
          convert /tmp/academic-hub-master.jpg -strip -resize 180x180! public/academic-hub-icon-v10-180.png
          convert /tmp/academic-hub-master.jpg -strip -resize 192x192! public/academic-hub-icon-v10-192.png
          convert /tmp/academic-hub-master.jpg -strip -resize 512x512! public/academic-hub-icon-v10-512.png
          convert /tmp/academic-hub-master.jpg -strip -resize 410x410 -gravity center -background '#071D40' -extent 512x512 public/academic-hub-icon-v10-512-maskable.png

          # Fail the workflow if a generated icon is suspiciously tiny/blank.
          test "$(stat -c%s public/academic-hub-icon-v10-192.png)" -gt 5000
          test "$(stat -c%s public/academic-hub-icon-v10-512.png)" -gt 15000

      - name: Commit generated icons
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/academic-hub-icon-v10-32.png \
                  public/academic-hub-icon-v10-180.png \
                  public/academic-hub-icon-v10-192.png \
                  public/academic-hub-icon-v10-512.png \
                  public/academic-hub-icon-v10-512-maskable.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
            exit 0
          fi
          git commit -m "Regenerate visible Academic Hub app icons"
          git push
