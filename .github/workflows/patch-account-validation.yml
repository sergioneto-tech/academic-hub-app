name: Patch account validation card

on:
  push:
    branches:
      - migration/account-pilot
    paths:
      - ".github/workflows/patch-account-validation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: migration/account-pilot
          fetch-depth: 0

      - name: Add validation card before account creation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pages/Settings.tsx")
          text = path.read_text(encoding="utf-8")

          old = '  const [resetBusy, setResetBusy] = useState<boolean>(false);\n'
          new = old + '  const [accountAlert, setAccountAlert] = useState<string | null>(null);\n'
          if old not in text:
              raise SystemExit("State insertion point not found")
          text = text.replace(old, new, 1)

          old = '''  const onSignUp = async () => {
            if (!cloudConfig) {
              toast({ title: "Sincronização indisponível", description: "Falta configuração do servidor (Supabase).", variant: "destructive" });
              return;
            }
            try {
              const result = await signUp(cloudConfig, cloudEmail.trim(), cloudPass);
          '''
          new = '''  const onSignUp = async () => {
            setAccountAlert(null);

            const email = cloudEmail.trim();
            if (!email || !cloudPass) {
              setAccountAlert("Preenche o email e a password antes de criares a conta. Só depois será enviado o email de confirmação.");
              return;
            }
            if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
              setAccountAlert("Indica um endereço de email válido antes de continuares.");
              return;
            }
            if (cloudPass.length < 8) {
              setAccountAlert("A password deve ter pelo menos 8 caracteres.");
              return;
            }

            if (!cloudConfig) {
              toast({ title: "Sincronização indisponível", description: "Falta configuração do servidor (Supabase).", variant: "destructive" });
              return;
            }
            try {
              const result = await signUp(cloudConfig, email, cloudPass);
          '''
          if old not in text:
              raise SystemExit("onSignUp insertion point not found")
          text = text.replace(old, new, 1)

          old = '<Input value={cloudEmail} onChange={(e) => setCloudEmail(e.target.value)} placeholder="teu@email.com" />'
          new = '<Input value={cloudEmail} onChange={(e) => { setCloudEmail(e.target.value); setAccountAlert(null); }} placeholder="teu@email.com" />'
          if old not in text:
              raise SystemExit("Email input not found")
          text = text.replace(old, new, 1)

          old = '<Input value={cloudPass} onChange={(e) => setCloudPass(e.target.value)} type="password" placeholder="••••••••" />'
          new = '<Input value={cloudPass} onChange={(e) => { setCloudPass(e.target.value); setAccountAlert(null); }} type="password" placeholder="••••••••" />'
          if old not in text:
              raise SystemExit("Password input not found")
          text = text.replace(old, new, 1)

          old = '''          <div className="flex flex-wrap gap-2">
            <Button onClick={onSignUp} disabled={!cloudConfig}>Criar conta</Button>
          '''
          new = '''          {accountAlert && (
            <div
              role="alert"
              aria-live="assertive"
              className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-4"
            >
              <div className="text-sm font-semibold text-amber-700 dark:text-amber-300">Preenche os dados da conta</div>
              <p className="mt-1 text-xs text-muted-foreground">{accountAlert}</p>
            </div>
          )}

          <div className="flex flex-wrap gap-2">
            <Button onClick={onSignUp} disabled={!cloudConfig}>Criar conta</Button>
          '''
          if old not in text:
              raise SystemExit("Account buttons insertion point not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Settings.tsx
          git commit -m "Add account creation validation card"
          git push origin HEAD:migration/account-pilot
