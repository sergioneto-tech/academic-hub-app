name: Prepare Controlled Update Shell

on:
  push:
    paths:
      - .github/workflows/prepare-controlled-update-shell.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply controlled app-shell update transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          version = Path('src/lib/version.ts')
          text = version.read_text()
          text = text.replace('APP_VERSION = "1.5.3"', 'APP_VERSION = "1.5.4"')
          version.write_text(text)

          sw = Path('public/sw.js')
          text = sw.read_text()
          text = text.replace('const SW_VERSION = "1.5.3-security-account-1";', 'const SW_VERSION = "1.5.4-controlled-shell-1";')
          text = text.replace('const PRECACHE_URLS = [\n', 'const PRECACHE_URLS = [\n  "./index.html",\n')
          text = text.replace('"./release-notes.json?v=1.5.3"', '"./release-notes.json?v=1.5.4"')

          marker = 'self.addEventListener("push", (event) => {'
          fetch_handler = r'''const NETWORK_ONLY_PATHS = new Set(["/sw.js", "/release-notes.json", "/security-status.json"]);

self.addEventListener("fetch", (event) => {
  const request = event.request;
  if (request.method !== "GET") return;

  const url = new URL(request.url);
  if (url.origin !== self.location.origin) return;

  // Estes recursos têm de vir sempre da rede para a versão instalada conseguir
  // descobrir uma nova release ou o estado de segurança mais recente.
  if (NETWORK_ONLY_PATHS.has(url.pathname)) {
    event.respondWith(fetch(new Request(request, { cache: "no-store" })));
    return;
  }

  // Mantém o app-shell da versão atualmente instalada em cada dispositivo.
  // Uma versão nova já publicada no servidor só passa a ser usada depois de o
  // utilizador ativar explicitamente o Service Worker que está em espera.
  if (request.mode === "navigate") {
    event.respondWith(
      caches.open(CACHE).then(async (cache) => {
        const installedShell = await cache.match("./index.html");
        if (installedShell) return installedShell;
        const response = await fetch(request);
        if (response.ok) await cache.put("./index.html", response.clone());
        return response;
      })
    );
    return;
  }

  // Assets da aplicação são fixados ao cache da versão instalada. Recursos que
  // ainda não tenham sido vistos são obtidos da rede e guardados nesse cache.
  event.respondWith(
    caches.open(CACHE).then(async (cache) => {
      const cached = await cache.match(request);
      if (cached) return cached;
      const response = await fetch(request);
      if (response.ok && response.type === "basic") await cache.put(request, response.clone());
      return response;
    })
  );
});

'''
          if 'NETWORK_ONLY_PATHS' not in text:
              text = text.replace(marker, fetch_handler + marker)
          sw.write_text(text)

          notes_path = Path('public/release-notes.json')
          notes = json.loads(notes_path.read_text())
          entry = {
            "version": "1.5.4",
            "date": "2026-09-10",
            "kind": "app",
            "pushNotify": False,
            "changes": [
              "Reforçado o controlo de atualizações por dispositivo através de um app-shell gerido pelo Service Worker.",
              "A partir desta transição, novas versões publicadas deixam de substituir silenciosamente a versão instalada num arranque a frio.",
              "Release notes, estado de segurança e Service Worker continuam a ser consultados pela rede para detetar atualizações sem desbloquear o novo bundle.",
              "Mantidas as fases reais de atualização e a ativação apenas após o utilizador escolher Atualizar.",
              "Ativada de forma persistente a gravação dos Auth Audit Logs do Supabase no Postgres para reforçar a investigação de eventos de autenticação."
            ]
          }
          notes['latest'] = '1.5.4'
          notes['versions'] = [v for v in notes.get('versions', []) if v.get('version') != '1.5.4']
          notes['versions'].insert(0, entry)
          notes_path.write_text(json.dumps(notes, ensure_ascii=False, indent=2) + '\n')
          PY

          npm version 1.5.4 --no-git-tag-version

          git config user.name "academic-hub-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/version.ts public/sw.js public/release-notes.json package.json package-lock.json
          git commit -m "fix: enforce controlled updates from v1.5.4 onward"
          git push
