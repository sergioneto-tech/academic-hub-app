name: Quality checks

on:
  push:
    branches:
      - main
      - agent/academic-hub-2026-premium
  pull_request:
    branches:
      - main
      - validation/academic-hub-2026

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Bloqueia vulnerabilidades high/critical sem recorrer a upgrades major automáticos.
      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Release metadata consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const versionSource = fs.readFileSync('src/lib/version.ts', 'utf8');
          const match = versionSource.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
          if (!match) throw new Error('APP_VERSION não encontrado em src/lib/version.ts');
          const appVersion = match[1];

          const notes = JSON.parse(fs.readFileSync('public/release-notes.json', 'utf8'));
          if (notes.latest !== appVersion) {
            throw new Error(`release-notes.json latest=${notes.latest} mas APP_VERSION=${appVersion}`);
          }
          if (!Array.isArray(notes.versions) || !notes.versions.some((item) => item?.version === appVersion)) {
            throw new Error(`release-notes.json não contém a entrada da versão ${appVersion}`);
          }

          const indexHtml = fs.readFileSync('index.html', 'utf8');
          const shellMatch = indexHtml.match(/<meta\s+name=["']academic-hub-version["']\s+content=["']([^"']+)["']/i);
          if (!shellMatch) throw new Error('index.html não contém o marcador academic-hub-version');
          if (shellMatch[1] !== appVersion) {
            throw new Error(`index.html academic-hub-version=${shellMatch[1]} mas APP_VERSION=${appVersion}`);
          }

          const swSource = fs.readFileSync('public/sw.js', 'utf8');
          const swMatch = swSource.match(/const\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
          if (!swMatch) throw new Error('public/sw.js não declara APP_VERSION');
          if (swMatch[1] !== appVersion) {
            throw new Error(`public/sw.js APP_VERSION=${swMatch[1]} mas APP_VERSION=${appVersion}`);
          }
          const swVersionMatch = swSource.match(/const\s+SW_VERSION\s*=\s*["']([^"']+)["']/);
          if (!swVersionMatch || !swVersionMatch[1].startsWith(`${appVersion}-`)) {
            throw new Error(`public/sw.js SW_VERSION não está alinhado com a versão ${appVersion}`);
          }
          const autoActivateMatch = swSource.match(/const\s+AUTO_ACTIVATE\s*=\s*(true|false)/);
          if (!autoActivateMatch || autoActivateMatch[1] !== 'false') {
            throw new Error('public/sw.js tem de manter AUTO_ACTIVATE=false para não misturar bundles durante uma atualização');
          }
          if (!swSource.includes('APP_SHELL_VERSION_MARKER') || !swSource.includes('fetchVerifiedAppShell')) {
            throw new Error('public/sw.js não contém a validação do app-shell antes da instalação');
          }

          for (const entry of notes.versions ?? []) {
            const kind = entry?.kind ?? 'app';
            if (!['app', 'security', 'mixed'].includes(kind)) {
              throw new Error(`Tipo de release inválido em ${entry?.version ?? 'desconhecida'}: ${kind}`);
            }
            if ((kind === 'security' || kind === 'mixed') && !/^\d{4}\.\d{2}$/.test(String(entry?.securityLevel ?? ''))) {
              throw new Error(`Release ${entry?.version ?? 'desconhecida'} (${kind}) exige securityLevel no formato YYYY.MM`);
            }
            if (entry?.pushNotify !== undefined && typeof entry.pushNotify !== 'boolean') {
              throw new Error(`pushNotify inválido em ${entry?.version ?? 'desconhecida'}`);
            }
          }
          console.log(`Release metadata, app shell and service worker aligned with v${appVersion}.`);
          NODE

      - name: Require release bump or PWA build revision for production runtime changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          parent="$(git rev-parse HEAD^)"
          changed="$(git diff --name-only "$parent" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if ! printf '%s\n' "$changed" | grep -Eq '^(src/|public/|index\.html$|package\.json$|package-lock\.json$|vite\.config\.|tsconfig)'; then
            echo "No production runtime files changed; release/build revision not required."
            exit 0
          fi

          read_app_version() {
            node -e "const s=require('fs').readFileSync(process.argv[1],'utf8'); const m=s.match(/APP_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); if(!m) process.exit(2); process.stdout.write(m[1]);" "$1"
          }

          current_version="$(read_app_version src/lib/version.ts)"
          previous_version="$(git show "$parent:src/lib/version.ts" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/APP_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); if(!m) process.exit(2); process.stdout.write(m[1]);});")"

          if [ "$current_version" != "$previous_version" ]; then
            echo "Runtime production change accompanied by release bump: $previous_version -> $current_version."
            exit 0
          fi

          current_sw="$(node -e "const s=require('fs').readFileSync('public/sw.js','utf8'); const m=s.match(/const\\s+SW_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); if(!m) process.exit(2); process.stdout.write(m[1]);")"
          previous_sw="$(git show "$parent:public/sw.js" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{const m=s.match(/const\\s+SW_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); if(!m) process.exit(2); process.stdout.write(m[1]);});")"

          if [ "$current_sw" != "$previous_sw" ]; then
            echo "Same public app version ($current_version) with a new PWA build revision: $previous_sw -> $current_sw."
            exit 0
          fi

          echo "::error::Ficheiros de produção mudaram sem incrementar APP_VERSION ($current_version) nem SW_VERSION ($current_sw). Para manutenção sem nova versão pública, altera apenas o sufixo de SW_VERSION."
          exit 1

      - name: TypeScript project check
        run: npx tsc -b --pretty false

      - name: Production build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Lint changed application files
        run: >-
          npx eslint
          src/App.tsx
          src/components/AppErrorBoundary.tsx
          src/components/AccountSecurityCard.tsx
          src/components/AdminUserMonitor.tsx
          src/components/CloudAccountPanel.tsx
          src/components/CloudRecoveryCard.tsx
          src/components/CloudSyncNotice.tsx
          src/components/CloudSyncStatusBadge.tsx
          src/components/CourseEvaluationSettings.tsx
          src/components/EvaluationFrameworkNotice.tsx
          src/components/EvaluationModeSelector.tsx
          src/components/FeedbackCloudBridge.tsx
          src/components/Layout.tsx
          src/components/LegacyEvaluationSavePanel.tsx
          src/components/ProfileAvatarEditor.tsx
          src/components/PucImportEntry.tsx
          src/components/PucInitialCatalogProposal.tsx
          src/components/PucReviewDraft.tsx
          src/components/PushDeepLinkNotice.tsx
          src/components/ReleaseUpdateNotice.tsx
          src/components/SecurityStatusBadge.tsx
          src/components/SecurityStatusCard.tsx
          src/components/SecurityVerificationPanel.tsx
          src/components/UpdateProgressModal.tsx
          src/components/ui/card.tsx
          src/components/ui/pt-datetime-input.tsx
          src/hooks/useAutoSync.ts
          src/hooks/useRealtimeSync.ts
          src/lib/AppStore.tsx
          src/lib/UpdateProvider.tsx
          src/lib/calculations.ts
          src/lib/cloudHistory.ts
          src/lib/cloudSync.ts
          src/lib/cloudSyncState.ts
          src/lib/degreeTheme.ts
          src/lib/pucAdminReview.ts
          src/lib/pucCatalog.ts
          src/lib/pucCorrections.ts
          src/lib/pucImportApply.ts
          src/lib/pucImportDraft.ts
          src/lib/pucInitialSubmission.ts
          src/lib/pucParser.ts
          src/lib/pucPdf.ts
          src/lib/pucUpdateAlerts.ts
          src/lib/pucVersionState.ts
          src/lib/realtimeSync.ts
          src/lib/securitySelfCheck.ts
          src/lib/securityTelemetry.ts
          src/lib/storage.ts
          src/lib/theme.ts
          src/lib/transparencyDocument.ts
          src/lib/types.ts
          src/lib/updateLifecycle.ts
          src/lib/version.ts
          src/pages/AcademicReport.tsx
          src/pages/CourseDetailPremium.tsx
          src/pages/FlexibleCourseDetail.tsx
          src/pages/Dashboard.tsx
          src/pages/Help.tsx
          src/pages/History.tsx
          src/pages/Legal.tsx
          src/pages/PucAdminReviewLab.tsx
          src/pages/PucImportPage.tsx
          src/pages/PucSharedReviewLab.tsx
          src/pages/PucUpdateAlertsLab.tsx
          src/pages/SecurityPrivacy.tsx
          src/pages/SettingsPremium.tsx
          src/pages/Transparency.tsx
          src/test/cloud-sync-reliability.test.ts
          src/test/puc-catalog-selection.test.ts
          src/test/puc-import-apply.test.ts
          src/test/puc-import-draft.test.ts
          src/test/puc-parser.test.ts
          src/test/puc-pdf.test.ts
          src/test/regulation-2026.test.ts
          src/test/security-self-check.test.ts
          src/test/update-lifecycle.test.ts
