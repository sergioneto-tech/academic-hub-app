name: Quality checks

on:
  push:
    branches:
      - main
      - agent/academic-hub-2026-premium
  pull_request:
    branches:
      - main
      - validation/academic-hub-2026

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Bloqueia vulnerabilidades high/critical sem recorrer a upgrades major automáticos.
      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Release metadata consistency
        run: |
          node <<'NODE'
          const fs = require('fs');
          const versionSource = fs.readFileSync('src/lib/version.ts', 'utf8');
          const match = versionSource.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
          if (!match) throw new Error('APP_VERSION não encontrado em src/lib/version.ts');
          const appVersion = match[1];
          const notes = JSON.parse(fs.readFileSync('public/release-notes.json', 'utf8'));
          if (notes.latest !== appVersion) {
            throw new Error(`release-notes.json latest=${notes.latest} mas APP_VERSION=${appVersion}`);
          }
          if (!Array.isArray(notes.versions) || !notes.versions.some((item) => item?.version === appVersion)) {
            throw new Error(`release-notes.json não contém a entrada da versão ${appVersion}`);
          }
          console.log(`Release metadata aligned with v${appVersion}.`);
          NODE

      - name: TypeScript project check
        run: npx tsc -b --pretty false

      - name: Production build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Lint changed application files
        run: >-
          npx eslint
          src/App.tsx
          src/components/AdminUserMonitor.tsx
          src/components/CloudAccountPanel.tsx
          src/components/CloudRecoveryCard.tsx
          src/components/CloudSyncStatusBadge.tsx
          src/components/CourseEvaluationSettings.tsx
          src/components/EvaluationFrameworkNotice.tsx
          src/components/EvaluationModeSelector.tsx
          src/components/FeedbackCloudBridge.tsx
          src/components/Layout.tsx
          src/components/ProfileAvatarEditor.tsx
          src/components/SecurityStatusBadge.tsx
          src/components/SecurityStatusCard.tsx
          src/components/UpdateProgressModal.tsx
          src/components/ui/card.tsx
          src/components/ui/pt-datetime-input.tsx
          src/hooks/useAutoSync.ts
          src/hooks/useRealtimeSync.ts
          src/lib/AppStore.tsx
          src/lib/UpdateProvider.tsx
          src/lib/calculations.ts
          src/lib/cloudHistory.ts
          src/lib/cloudSync.ts
          src/lib/cloudSyncState.ts
          src/lib/degreeTheme.ts
          src/lib/realtimeSync.ts
          src/lib/storage.ts
          src/lib/theme.ts
          src/lib/types.ts
          src/lib/version.ts
          src/pages/AcademicReport.tsx
          src/pages/CourseDetailPremium.tsx
          src/pages/FlexibleCourseDetail.tsx
          src/pages/Dashboard.tsx
          src/pages/Help.tsx
          src/pages/History.tsx
          src/pages/Legal.tsx
          src/pages/SettingsPremium.tsx
          src/test/cloud-sync-reliability.test.ts
          src/test/regulation-2026.test.ts
