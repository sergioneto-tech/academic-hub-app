name: Refresh lockfile cleanup

on:
  push:
    branches:
      - fix/bundle-dependency-cleanup-20260907
    paths:
      - "package.json"
      - ".github/workflows/refresh-lockfile-cleanup.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/bundle-dependency-cleanup-20260907

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-lockfile-cleanup.yml
          git add package-lock.json .github/workflows/refresh-lockfile-cleanup.yml
          git commit -m "Atualizar lockfile após limpeza de dependências"
          git push
