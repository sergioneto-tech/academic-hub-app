name: Prepare Academic Hub 1.5.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1-5-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bump app version and release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const versionPath = 'src/lib/version.ts';
          let versionSource = fs.readFileSync(versionPath, 'utf8');
          versionSource = versionSource.replace(/APP_VERSION\s*=\s*["']1\.5\.0["']/, 'APP_VERSION = "1.5.1"');
          if (!versionSource.includes('APP_VERSION = "1.5.1"')) throw new Error('Não foi possível atualizar APP_VERSION para 1.5.1');
          fs.writeFileSync(versionPath, versionSource);

          const notesPath = 'public/release-notes.json';
          const notes = JSON.parse(fs.readFileSync(notesPath, 'utf8'));
          notes.versions = Array.isArray(notes.versions) ? notes.versions : [];
          const entry = {
            version: '1.5.1',
            date: '2026-09-09',
            kind: 'app',
            pushNotify: false,
            changes: [
              'Separadas formalmente a versão da aplicação e o nível de segurança, evitando tratar uma atualização funcional como atualização de segurança.',
              'Novo aviso de atualização distingue atualização normal, atualização de segurança e atualização mista, apresentando os identificadores corretos.',
              'Atualização controlada pelo utilizador em cada dispositivo, com fases reais do Service Worker e sem percentagens simuladas.',
              'Estado de segurança compacto no Início e detalhes completos em Definições, alimentados pela vistoria automática semanal.',
              'Infraestrutura de notificações Push de releases preparada com deduplicação; esta versão fica sem envio Push automático para permitir validação inicial.'
            ]
          };
          const existing = notes.versions.findIndex((item) => item?.version === entry.version);
          if (existing >= 0) notes.versions[existing] = entry;
          else notes.versions.unshift(entry);
          notes.latest = entry.version;
          fs.writeFileSync(notesPath, JSON.stringify(notes, null, 2) + '\n');
          NODE

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/version.ts public/release-notes.json; then
            echo "Release 1.5.1 already prepared."
            exit 0
          fi
          git config user.name "academic-hub-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add src/lib/version.ts public/release-notes.json
          git commit -m "release: Academic Hub 1.5.1"
          git pull --rebase origin main
          git push origin HEAD:main
