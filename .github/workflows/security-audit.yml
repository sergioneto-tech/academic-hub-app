name: Weekly security audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/security-audit.mjs"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Domingo de madrugada. Em Madeira corresponde aproximadamente a 04:17/05:17,
    # consoante o horário de inverno/verão.
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: academic-hub-security-audit
  cancel-in-progress: true

# O workflow só escreve o ficheiro público com o resultado da vistoria.
# Não altera políticas, dados dos alunos, segredos ou configuração do Supabase.
permissions:
  contents: write
  issues: write

jobs:
  audit:
    name: Security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: apgoyzfzuukkpmuxiqvy
      ACADEMIC_HUB_URL: https://academichub.sergioneto.pt

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate audit credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Prepare production database connection
        shell: bash
        run: |
          set -euo pipefail
          encoded_password="$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')"
          echo "SUPABASE_DB_URL=postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require" >> "$GITHUB_ENV"

      - name: Run complete security audit
        id: security_audit
        shell: bash
        run: |
          set +e
          node scripts/security-audit.mjs
          audit_exit=$?
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish latest security status
        id: publish_status
        shell: bash
        run: |
          set -euo pipefail
          cp public/security-status.json /tmp/academic-hub-security-status.json
          git config user.name "academic-hub-security-bot"
          git config user.email "security-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/academic-hub-security-status.json public/security-status.json

            if git diff --quiet -- public/security-status.json; then
              echo "Security status already matches the latest main branch."
              exit 0
            fi

            git add public/security-status.json
            git commit -m "chore: update weekly security status"
            if git push origin HEAD:main; then
              echo "Security status published."
              exit 0
            fi

            echo "Concurrent update detected while publishing (attempt $attempt/3); retrying on the latest main."
            sleep 2
          done

          echo "::error::Não foi possível publicar o estado de segurança após três tentativas sem sobrescrever alterações concorrentes."
          exit 1

      - name: Sync security audit alert
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_CODE: ${{ steps.security_audit.outputs.exit_code }}
          PUBLISH_OUTCOME: ${{ steps.publish_status.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Security audit requires attention"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[0].number // empty')

          needs_attention=false
          if [ -z "$AUDIT_CODE" ] || [ "$AUDIT_CODE" != "0" ] || [ "$PUBLISH_OUTCOME" != "success" ]; then
            needs_attention=true
          fi

          if [ "$needs_attention" = true ]; then
            body="A vistoria semanal do Academic Hub não terminou em estado protegido.\n\n- Código da auditoria: ${AUDIT_CODE:-indisponível}\n- Publicação do estado: ${PUBLISH_OUTCOME:-indisponível}\n- Execução: $RUN_URL\n\nConsulta os logs e o ficheiro public/security-status.json antes de considerar o estado resolvido."
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "A vistoria semanal voltou a concluir com sucesso: $RUN_URL"
          fi

      - name: Fail workflow when audit requires attention
        if: always()
        shell: bash
        run: |
          code="${{ steps.security_audit.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "::error::A vistoria não produziu um resultado válido."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::A vistoria publicou um estado de atenção/revisão. Consulta public/security-status.json e os logs deste workflow."
            exit "$code"
          fi
          echo "Vistoria semanal concluída sem problemas bloqueantes."
