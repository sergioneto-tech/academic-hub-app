name: Security log capability check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-log-capability-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check unified logs response structure
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_LOGS_TOKEN"
          end=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          start=$(date -u -d '15 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          code=$(curl --silent --show-error --output /tmp/logs.json --write-out '%{http_code}' \
            --get 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs' \
            --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" \
            --data-urlencode "sql=select count() as n from logs where source = 'edge_logs'" \
            --data-urlencode "iso_timestamp_start=$start" \
            --data-urlencode "iso_timestamp_end=$end")
          test "$code" = "200"
          echo "HTTP=$code top_type=$(jq -r 'type' /tmp/logs.json) result_type=$(jq -r '.result|type' /tmp/logs.json)"
          if [ "$(jq -r '.result|type' /tmp/logs.json)" = "array" ]; then
            echo "result_rows=$(jq -r '.result|length' /tmp/logs.json)"
            echo "row_shape=$(jq -r 'if (.result|length)>0 then (.result[0]|type) else "empty" end' /tmp/logs.json)"
            echo "row_keys=$(jq -r 'if (.result|length)>0 and (.result[0]|type)=="object" then (.result[0]|keys|join(",")) else "none" end' /tmp/logs.json)"
          else
            echo "result_length=$(jq -r '.result|length' /tmp/logs.json)"
          fi

      - name: Check database query capability without writing data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          code=$(curl --silent --show-error --output /tmp/db.json --write-out '%{http_code}' \
            --request POST 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/database/query' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"select 1 as ok","read_only":true}')
          echo "database_query_http=$code"
          test "$code" = "201" || test "$code" = "200"
