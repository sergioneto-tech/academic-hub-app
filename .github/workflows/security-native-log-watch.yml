name: Native security log watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-native-log-watch.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: academic-hub-native-security-log-watch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      PROJECT_REF: apgoyzfzuukkpmuxiqvy
      SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
      INGEST_URL: https://apgoyzfzuukkpmuxiqvy.supabase.co/functions/v1/security-native-ingest
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_LOGS_TOKEN" || { echo "::error::Missing SUPABASE_LOGS_TOKEN"; exit 1; }

      - name: Read and ingest native security signals
        id: watch
        shell: bash
        run: |
          set -euo pipefail
          end=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          start=$(date -u -d '20 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          sql="select toStartOfFiveMinutes(timestamp) as bucket, log_attributes['request.headers.x_real_ip'] as ip, log_attributes['request.cf.country'] as country, log_attributes['request.path'] as path, toInt32OrZero(log_attributes['response.status_code']) as status, log_attributes['request.headers.x_client_info'] as client_info, count() as hits from logs where source='edge_logs' and (((log_attributes['request.path'] like '/auth/v1/token%') and toInt32OrZero(log_attributes['response.status_code']) in (400,401,403,429)) or ((log_attributes['request.path'] like '/rest/v1/%' or log_attributes['request.path'] like '/functions/v1/%' or log_attributes['request.path'] like '/storage/v1/%') and toInt32OrZero(log_attributes['response.status_code']) in (401,403,429))) group by bucket,ip,country,path,status,client_info having hits >= 3 order by bucket desc limit 200"
          code=$(curl --silent --show-error --output /tmp/signals.json --write-out '%{http_code}' --get "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end")
          test "$code" = "200" || { echo "::error::Logs API HTTP $code"; exit 1; }
          rows=$(jq -r '.result|length' /tmp/signals.json)
          echo "Native log groups inspected: $rows"
          accepted=0; incidents=0
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            bucket=$(jq -r '.bucket // empty' <<<"$row")
            ip=$(jq -r '.ip // empty' <<<"$row")
            country=$(jq -r '.country // empty' <<<"$row")
            path=$(jq -r '.path // empty' <<<"$row")
            status=$(jq -r '.status // 0' <<<"$row")
            client=$(jq -r '.client_info // empty' <<<"$row")
            hits=$(jq -r '.hits // 0' <<<"$row")
            if [[ "$path" == /auth/v1/token* ]]; then
              if [ "$status" = "429" ]; then kind=auth_rate_limited; else kind=auth_failure; fi
            elif [ "$status" = "429" ]; then
              kind=api_rate_limited
            else
              kind=unauthorized_api
            fi
            signal=$(printf '%s|%s|%s|%s|%s' "$bucket" "$kind" "$ip" "$path" "$status" | sha256sum | cut -d' ' -f1)
            first_seen="${bucket%Z}Z"
            last_seen=$(date -u -d "$first_seen + 5 minutes" +'%Y-%m-%dT%H:%M:%SZ')
            payload=$(jq -n \
              --arg signalKey "$signal" \
              --arg kind "$kind" \
              --arg ipAddress "$ip" \
              --arg countryCode "$country" \
              --arg path "$path" \
              --argjson status "$status" \
              --argjson hits "$hits" \
              --arg firstSeen "$first_seen" \
              --arg lastSeen "$last_seen" \
              --arg clientInfo "$client" \
              '{signalKey:$signalKey,kind:$kind,ipAddress:$ipAddress,countryCode:$countryCode,path:$path,status:$status,hits:$hits,firstSeen:$firstSeen,lastSeen:$lastSeen,clientInfo:$clientInfo}')
            ingest_code=$(curl --silent --show-error --output /tmp/ingest.json --write-out '%{http_code}' --request POST "$INGEST_URL" --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" --header 'Content-Type: application/json' --data "$payload")
            test "$ingest_code" = "200" || { echo "::error::Native signal ingest HTTP $ingest_code"; cat /tmp/ingest.json; exit 1; }
            accepted=$((accepted+1))
            if jq -e '.result.incident_new == true' /tmp/ingest.json >/dev/null 2>&1; then incidents=$((incidents+1)); fi
          done < <(jq -c '.result[]?' /tmp/signals.json)
          echo "processed=$accepted" >> "$GITHUB_OUTPUT"
          echo "incidents=$incidents" >> "$GITHUB_OUTPUT"
          echo "Signals accepted: $accepted; new incidents: $incidents"

      - name: Sync monitor health alert
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.watch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Native security log watch requires attention"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[0].number // empty')
          if [ "$OUTCOME" != "success" ]; then
            body="O vigilante dos logs nativos do Supabase não terminou corretamente. Não significa que houve uma intrusão; significa que a monitorização precisa de revisão. Execução: $RUN_URL"
            if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          elif [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "A monitorização dos logs nativos voltou a funcionar: $RUN_URL"; fi
