name: One-time 72h security scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-retroactive-scan.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PROJECT_REF: apgoyzfzuukkpmuxiqvy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Identify database role used by Management API
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg q "select current_user as current_user, session_user as session_user" '{query:$q}')
          code=$(curl --silent --show-error --output /tmp/role.json --write-out '%{http_code}' --request POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header 'Content-Type: application/json' --data "$payload")
          test "$code" = "201" || test "$code" = "200" || { echo "::error::Role probe HTTP $code"; cat /tmp/role.json; exit 1; }
          jq -r '.[0] | "current_user=\(.current_user) session_user=\(.session_user)"' /tmp/role.json
