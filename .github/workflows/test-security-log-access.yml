name: Test security log access

on:
  push:
    branches: [main]
    paths: [".github/workflows/test-security-log-access.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Test Supabase unified logs permission
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          START=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="select count() as n from logs where source = 'auth_logs'"
          CODE=$(curl -sS -o /tmp/logs.json -w '%{http_code}' --get \
            'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${SQL}" \
            --data-urlencode "iso_timestamp_start=${START}" \
            --data-urlencode "iso_timestamp_end=${END}")
          echo "HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            cat /tmp/logs.json
            exit 1
          fi
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/logs.json','utf8')); console.log('Unified logs access OK; rows:', Array.isArray(j.result)?j.result.length:0);"
