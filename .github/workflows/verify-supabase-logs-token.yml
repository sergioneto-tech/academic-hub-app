name: Verify Supabase Logs Token

on:
  push:
    paths:
      - .github/workflows/verify-supabase-logs-token.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify scoped logs token
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        run: |
          test -n "$SUPABASE_LOGS_TOKEN" || exit 1
          code=$(curl --silent --show-error --output /tmp/logs.json --write-out '%{http_code}' \
            --get 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs' \
            --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" \
            --data-urlencode "sql=select timestamp, source from logs order by timestamp desc limit 1")
          echo "Logs API HTTP=$code"
          test "$code" = "200" || exit 1

      - name: Inspect only Auth audit-log configuration fields
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || exit 1
          code=$(curl --silent --show-error --output /tmp/auth-config.json --write-out '%{http_code}' \
            'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/config/auth' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Auth config HTTP=$code"
          test "$code" = "200" || exit 1
          jq 'to_entries | map(select(.key | ascii_downcase | contains("audit"))) | from_entries' /tmp/auth-config.json
