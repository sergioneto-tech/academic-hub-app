name: Verify Supabase Logs Token

on:
  push:
    paths:
      - .github/workflows/verify-supabase-logs-token.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current unified logs source field
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        run: |
          test -n "$SUPABASE_LOGS_TOKEN" || exit 1
          end=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          start=$(date -u -d '23 hours 55 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          for field in source source_name; do
            out="/tmp/${field}.json"
            code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --get 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs' \
              --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" \
              --data-urlencode "sql=select $field, count() as n from logs group by $field order by n desc limit 30" \
              --data-urlencode "iso_timestamp_start=$start" \
              --data-urlencode "iso_timestamp_end=$end")
            echo "$field HTTP=$code rows=$(jq '.result | length' "$out" 2>/dev/null || echo unknown)"
            if [ "$code" != "200" ]; then jq -r '.error // "query rejected"' "$out" 2>/dev/null || true; fi
          done
