name: Verify Supabase Logs Token

on:
  push:
    paths:
      - .github/workflows/verify-supabase-logs-token.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret is configured
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        run: |
          test -n "$SUPABASE_LOGS_TOKEN" || { echo "SUPABASE_LOGS_TOKEN is missing"; exit 1; }

      - name: Verify logs read permission
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        run: |
          code=$(curl --silent --show-error --output /tmp/logs-response.json --write-out '%{http_code}' \
            --get 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs' \
            --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" \
            --data-urlencode "sql=select timestamp, source from logs order by timestamp desc limit 1")
          echo "Supabase Logs API HTTP $code"
          if [ "$code" != "200" ]; then
            jq -r '.error // .message // "Logs API request failed"' /tmp/logs-response.json 2>/dev/null || true
            exit 1
          fi
          echo "analytics_logs_read verified"
