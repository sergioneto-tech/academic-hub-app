name: Verify Supabase Logs Token

on:
  push:
    paths:
      - .github/workflows/verify-supabase-logs-token.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify legacy project logs stream
        env:
          SUPABASE_LOGS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN }}
        run: |
          test -n "$SUPABASE_LOGS_TOKEN" || exit 1
          end=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          start=$(date -u -d '23 hours 55 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          for source in edge_logs auth_logs postgres_logs; do
            out="/tmp/${source}.json"
            code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --get 'https://api.supabase.com/v1/projects/apgoyzfzuukkpmuxiqvy/analytics/endpoints/logs.all' \
              --header "Authorization: Bearer $SUPABASE_LOGS_TOKEN" \
              --data-urlencode "sql=select count(1) as n from $source" \
              --data-urlencode "iso_timestamp_start=$start" \
              --data-urlencode "iso_timestamp_end=$end")
            echo "$source HTTP=$code rows=$(jq '.result | length' "$out" 2>/dev/null || echo unknown) count=$(jq -r '.result[0].n // "none"' "$out" 2>/dev/null || echo none)"
            if [ "$code" != "200" ]; then jq -r '.error // .message // "query rejected"' "$out" 2>/dev/null || true; fi
          done
