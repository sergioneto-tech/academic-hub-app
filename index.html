<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1D3A" />
    <meta name="color-scheme" content="light dark" />

    <script>
      (() => {
        const userAgent = navigator.userAgent || "";
        const samsungInternet = /SamsungBrowser\//i.test(userAgent);
        const standalone =
          window.matchMedia?.("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        window.__ACADEMIC_HUB_INSTALL_ENV__ = { samsungInternet, standalone };

        // O Samsung Internet está atualmente a gerar WebAPKs com um target SDK
        // desatualizado em alguns dispositivos. Nesses casos, não disponibilizamos
        // o manifesto neste navegador para impedir o aviso alarmante do Play Protect.
        if (!samsungInternet) {
          const manifest = document.createElement("link");
          manifest.rel = "manifest";
          manifest.href = "./manifest.webmanifest?v=5";
          document.head.appendChild(manifest);
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./academic-hub-premium.svg?v=5" />

    <title>Academic Hub</title>
    <meta name="description" content="Gestor académico pessoal — cadeiras, avaliações, calendário, progresso e alertas." />

    <style>
      #samsung-install-guard[hidden] { display: none; }
      #samsung-install-guard {
        position: fixed;
        z-index: 2147483647;
        right: 16px;
        bottom: 16px;
        left: 16px;
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
        border: 1px solid rgba(211, 169, 78, 0.48);
        border-radius: 18px;
        background: #0b1d3a;
        color: #f8fafc;
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.38);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #samsung-install-guard strong {
        display: block;
        margin-bottom: 6px;
        font-size: 15px;
      }
      #samsung-install-guard p {
        margin: 0;
        color: rgba(248, 250, 252, 0.78);
        font-size: 13px;
        line-height: 1.45;
      }
      #samsung-install-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      #samsung-install-actions button {
        min-height: 42px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      #open-academic-hub-in-chrome {
        border-color: #d3a94e !important;
        background: #d3a94e;
        color: #0b1d3a;
      }
      #dismiss-samsung-install-guard {
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
      }
      @media (min-width: 560px) {
        #samsung-install-guard {
          right: 24px;
          bottom: 24px;
          left: auto;
          width: min(440px, calc(100vw - 48px));
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <aside id="samsung-install-guard" hidden role="dialog" aria-labelledby="samsung-install-title" aria-live="polite">
      <strong id="samsung-install-title">Instalação recomendada através do Chrome</strong>
      <p>
        Neste dispositivo, o Samsung Internet está a gerar a instalação com uma versão Android desatualizada,
        provocando o aviso do Play Protect. Abre o Academic Hub no Chrome para instalar sem esse alerta.
      </p>
      <div id="samsung-install-actions">
        <button id="open-academic-hub-in-chrome" type="button">Abrir no Chrome</button>
        <button id="dismiss-samsung-install-guard" type="button">Continuar no browser</button>
      </div>
    </aside>

    <script>
      (() => {
        const environment = window.__ACADEMIC_HUB_INSTALL_ENV__;
        if (!environment?.samsungInternet || environment.standalone) return;

        const dismissedKey = "academicHub:samsungInstallNoticeDismissed";
        try {
          if (sessionStorage.getItem(dismissedKey) === "1") return;
        } catch {
          // A mensagem continua disponível quando o armazenamento da sessão está bloqueado.
        }

        const guard = document.getElementById("samsung-install-guard");
        const openButton = document.getElementById("open-academic-hub-in-chrome");
        const dismissButton = document.getElementById("dismiss-samsung-install-guard");
        if (!guard || !openButton || !dismissButton) return;

        guard.hidden = false;

        openButton.addEventListener("click", () => {
          const current = new URL(window.location.href);
          const destination = `${current.host}${current.pathname}${current.search}`;
          const fallback = encodeURIComponent(current.href);
          window.location.href = `intent://${destination}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallback};end`;
        });

        dismissButton.addEventListener("click", () => {
          guard.hidden = true;
          try {
            sessionStorage.setItem(dismissedKey, "1");
          } catch {
            // Sem impacto funcional.
          }
        });
      })();
    </script>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
