project_id = "apgoyzfzuukkpmuxiqvy"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_signup_to_uab"

# Estas funções aceitam chamadas sem Authorization ao nível do gateway:
# - GET público apenas devolve dados oficiais UAb já validados;
# - POST de cron/trigger é autenticado dentro da própria função por x-cron-secret;
# - academic-push valida internamente x-cron-secret ou o JWT do utilizador;
# - feedback-push aceita apenas o segredo interno usado pelo trigger da base de dados;
# - feedback-student-push aceita apenas o segredo interno usado pelos triggers de resposta/estado;
# - survey-push aceita apenas o segredo interno usado pelo trigger das avaliações;
# - admin-user-registration-push aceita apenas o segredo interno do trigger de novos registos;
# - security-event recebe telemetria de autenticação e faz a validação necessária dentro da função;
# - security-native-ingest valida um token scoped com Logs Read antes de ingerir sinais nativos.
[functions.academic-push]
verify_jwt = false

[functions.feedback-push]
verify_jwt = false

[functions.feedback-student-push]
verify_jwt = false

[functions.survey-push]
verify_jwt = false

[functions.admin-user-registration-push]
verify_jwt = false

[functions.uab-calendar-sync]
verify_jwt = false

[functions.uab-assessment-sync]
verify_jwt = false

[functions.security-event]
verify_jwt = false

[functions.security-native-ingest]
verify_jwt = false

# Endpoints autenticados: mantêm a barreira JWT do gateway e voltam a validar
# o utilizador dentro da própria função antes de devolver dados.
[functions.admin-user-summary]
verify_jwt = true

[functions.security-activity]
verify_jwt = true
